[package]
name = "gpui-shell-wasm-guest"
description = "Spike: write a gpui-shell view in Rust and compile it to a WebAssembly guest."
version = "0.9.0"
edition.workspace = true
publish = false

[dependencies]
gpui-shell-wasm-abi = { path = "../shell-wasm-abi" }
serde_json = { workspace = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# The reactive graph under `reactive`: synchronous effects and no imports
# (docs/wasm-retained-guest.md).
sycamore-reactive = "0.9.4"
