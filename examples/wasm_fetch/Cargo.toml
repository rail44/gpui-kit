[package]
name = "wasm-fetch"
description = "Spike: a guest that fetches over HTTP without blocking, under the network grants."
version = "0.1.0"
edition = "2024"
publish = false

# Built for `wasm32-unknown-unknown` on its own; see examples/wasm_todolist.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui-shell-wasm-guest = { path = "../../crates/shell-wasm-guest" }

[profile.release]
opt-level = "s"
lto = true
strip = true
